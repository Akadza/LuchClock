name: Host C++ tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*_test.cpp)
          test ${#tests[@]} -gt 0
          for source in "${tests[@]}"; do
            binary=$(mktemp)
            g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all "$source" -o "$binary"
            "$binary"
            rm -f "$binary"
          done
      - name: Run production reader, motor and controller with host hardware fakes
        shell: bash
        run: |
          set -euo pipefail
          cp secrets.example.h secrets.h
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Itests/fakes tests/integration/reader_motor_controller.cpp src/encoder/encoder_reader.cpp src/motor/motor_controller.cpp src/application/controller.cpp -o /tmp/luchclock-integration
          /tmp/luchclock-integration
