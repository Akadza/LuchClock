name: Host C++ tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*_test.cpp)
          test ${#tests[@]} -gt 0
          for source in "${tests[@]}"; do
            binary=$(mktemp)
            g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all "$source" -o "$binary"
            "$binary"
            rm -f "$binary"
          done
