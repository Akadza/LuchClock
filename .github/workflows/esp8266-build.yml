name: ESP8266 firmware build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.2.2"
      - name: Install pinned ESP8266 core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
      - name: Compile NodeMCU firmware
        run: |
          cp secrets.example.h secrets.h
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings all .
